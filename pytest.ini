[pytest]
pythonpath = .
testpaths =
    testcases/robot
    testcases/upper_body
    testcases/chassis
    testcases/head
addopts = -ra --import-mode=importlib
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
markers =
    hardware: 需要连接 TuyaRobot 真机
    smoke: 基础连接与只读检查
    motion: 会让机器人、头部或底盘产生运动
    manual: 需要测试人员人工确认
    danger: 校准、解除制动或其他高风险操作
    firmware: 固件升级测试
    reset: 用例结束后恢复对应模块默认参数
    robot: 整机测试
    upper_body: 上半身、左右臂或头部测试
    head: 头部 TCP 测试
    chassis: 底盘测试
